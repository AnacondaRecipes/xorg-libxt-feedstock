{% set name = "xorg-libXt" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: e0a774b33324f4d4c05b199ea45050f87206586d81655f8bef4dba434d931288

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11, libice aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  detect_binary_files_with_prefix: true
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - libtool
  host:
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-libice {{ xorg_libice }}
    - xorg-libsm {{ xorg_libsm }}
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-util-macros ==1.20.2

test:
  commands:
    - test -f $PREFIX/lib/libXt.dylib  # [osx]
    - test -f $PREFIX/lib/libXt.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxt
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxt
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org X11 toolkit intrinsics library.
  description: |
    The X.org X11 toolkit intrinsics library.
extra:
  recipe-maintainers:
    - pkgw
